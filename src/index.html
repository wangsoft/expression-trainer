<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇宙无敌表达训练系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ===== icon sprite: one stroke, one weight ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ic-wave" viewBox="0 0 24 24">
        <line x1="5" y1="14" x2="5" y2="18"/><line x1="10" y1="9" x2="10" y2="18"/>
        <line x1="14" y1="6" x2="14" y2="18"/><line x1="19" y1="11" x2="19" y2="18"/>
      </symbol>
      <symbol id="ic-spark" viewBox="0 0 24 24">
        <path d="M12 3.5 L13.4 9.4 L19.5 11 L13.4 12.6 L12 18.5 L10.6 12.6 L4.5 11 L10.6 9.4 Z"/>
      </symbol>
      <symbol id="ic-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.6"/>
        <circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="ic-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M18.9 5.1l-2.1 2.1M7.2 16.8l-2.1 2.1"/>
      </symbol>
      <symbol id="ic-clipboard" viewBox="0 0 24 24">
        <rect x="6" y="5" width="12" height="16" rx="2.2"/>
        <path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/>
      </symbol>
      <symbol id="ic-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2.2"/>
        <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>
      </symbol>
      <symbol id="ic-download" viewBox="0 0 24 24">
        <path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/>
      </symbol>
      <symbol id="ic-trash" viewBox="0 0 24 24">
        <path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
        <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
      </symbol>
      <symbol id="ic-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M6 11a6 6 0 0 0 12 0"/>
        <line x1="12" y1="17" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/>
      </symbol>
      <symbol id="ic-pause" viewBox="0 0 24 24">
        <path fill="currentColor" stroke="none" d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/>
      </symbol>
      <symbol id="ic-play" viewBox="0 0 24 24">
        <path fill="currentColor" stroke="none" d="M8 5.5v13l11-6.5z"/>
      </symbol>
      <symbol id="ic-stop" viewBox="0 0 24 24">
        <rect fill="currentColor" stroke="none" x="6.5" y="6.5" width="11" height="11" rx="2.6"/>
      </symbol>
      <symbol id="ic-doc" viewBox="0 0 24 24">
        <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
        <path d="M14 3v4h4"/>
        <line x1="9" y1="12.5" x2="15" y2="12.5"/><line x1="9" y1="16" x2="15" y2="16"/>
      </symbol>
      <symbol id="ic-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="20" y2="20"/>
      </symbol>
      <symbol id="ic-close" viewBox="0 0 24 24">
        <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
      </symbol>
      <symbol id="ic-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.2 4.5L19 7"/>
      </symbol>
      <symbol id="ic-history" viewBox="0 0 24 24">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v3.6h3.6"/>
        <path d="M12 8v4.3l3 1.7"/>
      </symbol>
      <symbol id="ic-back" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/><path d="M11 6l-6 6 6 6"/>
      </symbol>
    </defs>
  </svg>

  <!-- 主布局：三列 -->
  <div class="layout">
    <!-- 左栏：表达分析 -->
    <aside class="panel-left">
      <div class="panel-title"><svg class="icon"><use href="#ic-wave"/></svg> 表达分析</div>
      <div class="stat-row">
        <span class="stat-label">笼统词</span>
        <span id="stat-vague" class="stat-value stat-red">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">填充词</span>
        <span id="stat-fillers" class="stat-value stat-orange">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">犹豫词</span>
        <span id="stat-hedges" class="stat-value stat-yellow">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">表达密度</span>
        <span id="stat-density" class="stat-value stat-green">--</span>
      </div>
    </aside>

    <!-- 中间：主内容区 -->
    <main class="main-area">
      <!-- 顶部栏 -->
      <div class="topbar">
        <span class="app-title">宇宙无敌表达训练系统</span>
        <div class="topbar-right">
          <span id="timer" class="timer">00:00</span>
          <button id="btn-history" class="btn-icon" title="训练历史" aria-label="训练历史">
            <svg class="icon"><use href="#ic-history"/></svg>
          </button>
          <button id="btn-prompt-editor" class="btn-icon" title="训练规则" aria-label="训练规则">
            <svg class="icon"><use href="#ic-target"/></svg>
          </button>
          <button id="btn-settings" class="btn-icon" title="设置" aria-label="设置">
            <svg class="icon"><use href="#ic-settings"/></svg>
          </button>
        </div>
      </div>

      <!-- 字幕区顶部工具栏 -->
      <div class="subtitle-topbar">
        <button id="btn-paste" class="btn-sm btn-paste-top">
          <svg class="icon"><use href="#ic-clipboard"/></svg> 粘贴逐字稿
        </button>
        <div class="subtitle-topbar-right">
          <button id="btn-copy-text" class="btn-sm btn-copy-text hidden" title="复制原文">
            <svg class="icon"><use href="#ic-copy"/></svg> 复制
          </button>
          <button id="btn-save-text" class="btn-sm btn-save-text hidden" title="保存原文">
            <svg class="icon"><use href="#ic-download"/></svg> 保存
          </button>
          <button id="btn-clear" class="btn-sm btn-clear hidden" title="清空">
            <svg class="icon"><use href="#ic-trash"/></svg> 清空
          </button>
        </div>
      </div>

      <!-- 字幕滚动区 -->
      <div id="subtitle-scroll" class="subtitle-scroll">
        <div id="subtitle-container" class="subtitle-container">
          <div class="subtitle-line hint">点击下方按钮开始说话</div>
        </div>
      </div>

      <!-- 底部按钮（只保留核心操作） -->
      <div class="action-bar">
        <button id="btn-start" class="btn-main btn-start">
          <svg class="icon"><use href="#ic-mic"/></svg>
          <span class="btn-label">开始录制</span>
        </button>
        <button id="btn-pause" class="btn-main btn-pause hidden">
          <svg class="icon"><use href="#ic-pause"/></svg>
          <span class="btn-label">暂停</span>
        </button>
        <button id="btn-resume" class="btn-main btn-resume hidden">
          <svg class="icon"><use href="#ic-play"/></svg>
          <span class="btn-label">继续</span>
        </button>
        <button id="btn-stop" class="btn-main btn-stop hidden">
          <svg class="icon"><use href="#ic-stop"/></svg>
          <span class="btn-label">结束</span>
        </button>
        <button id="btn-report" class="btn-main btn-report hidden">
          <svg class="icon"><use href="#ic-doc"/></svg>
          <span class="btn-label">生成报告</span>
        </button>
      </div>
    </main>

    <!-- 右栏：实时反馈 -->
    <aside class="panel-right">
      <div class="panel-title"><svg class="icon"><use href="#ic-spark"/></svg> 实时反馈</div>
      <div id="feedback-content" class="feedback-content">
        <!-- 实时反馈内容 -->
      </div>
    </aside>
  </div>

  <!-- 耳机DJ少女 icon（签名） -->
  <div class="girl-icon">
    <svg width="44" height="44" viewBox="0 0 70 70" fill="none">
      <path d="M16 32 Q16 14 35 12 Q54 14 54 32" stroke="#E5007E" stroke-width="2.5" fill="none"/>
      <rect x="12" y="30" width="7" height="12" rx="3" fill="#E5007E" opacity="0.6"/>
      <rect x="51" y="30" width="7" height="12" rx="3" fill="#E5007E" opacity="0.6"/>
      <circle cx="35" cy="38" r="14" stroke="#E5007E" stroke-width="2" fill="none"/>
      <path d="M28 36 Q32 33 36 36" stroke="#E5007E" stroke-width="1.5" fill="none"/>
      <path d="M38 36 Q41 34 44 37" stroke="#E5007E" stroke-width="1.5" fill="none"/>
      <circle cx="32" cy="35.5" r="1.2" fill="#E5007E"/>
      <path d="M31 43 Q35 46 39 43" stroke="#E5007E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 粘贴逐字稿弹窗 -->
  <div id="paste-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2><svg class="icon"><use href="#ic-clipboard"/></svg> 粘贴逐字稿</h2>
        <button id="btn-close-paste" class="btn-close" aria-label="关闭">
          <svg class="icon"><use href="#ic-close"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="paste-composer">
          <p class="paste-hint">把逐字稿粘贴进来，我帮你分析</p>
          <textarea id="paste-textarea" class="paste-textarea" placeholder="在这里粘贴文字..."></textarea>
          <button id="btn-analyze-paste" class="btn-analyze">
            <svg class="icon"><use href="#ic-search"/></svg> 开始分析
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 报告弹窗 -->
  <div id="report-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2><svg class="icon"><use href="#ic-doc"/></svg> 表达分析报告</h2>
        <div class="modal-header-actions">
          <button id="btn-copy-report" class="btn-sm">
            <svg class="icon"><use href="#ic-copy"/></svg> 复制全文
          </button>
          <button id="btn-close-report" class="btn-close" aria-label="关闭">
            <svg class="icon"><use href="#ic-close"/></svg>
          </button>
        </div>
      </div>
      <div id="report-body" class="modal-body">
      </div>
    </div>
  </div>

  <!-- 训练历史弹窗 -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2><svg class="icon"><use href="#ic-history"/></svg> 训练历史</h2>
        <div class="modal-header-actions">
          <button id="btn-history-back" class="btn-sm hidden">
            <svg class="icon"><use href="#ic-back"/></svg> 返回列表
          </button>
          <button id="btn-close-history" class="btn-close" aria-label="关闭">
            <svg class="icon"><use href="#ic-close"/></svg>
          </button>
        </div>
      </div>
      <div id="history-body" class="modal-body"></div>
    </div>
  </div>

  <script src="api-shim.js"></script>
  <script src="app.js"></script>
</body>
</html>
